name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "blog/posts/**"
      - "scripts/build_blog.py"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blog from markdown
        run: python scripts/build_blog.py

      - name: Check Cloudflare token
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set — Worker must be deployed with wrangler from a logged-in machine."
          fi
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          echo "STRIPE_SECRET_KEY GitHub secret is present."

      - uses: cloudflare/wrangler-action@v3
        if: steps.cf.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

      - name: Put trimmed STRIPE_SECRET_KEY on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$STRIPE_SECRET_KEY" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_SECRET_KEY --name gofixweb-report-trigger

      - name: Confirm STRIPE_SECRET_KEY on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler secret list --name gofixweb-report-trigger > /tmp/cf-secrets.json
          cat /tmp/cf-secrets.json
          grep -q 'STRIPE_SECRET_KEY' /tmp/cf-secrets.json

      - name: Put ADMIN_BASIC_PASSWORD on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_BASIC_PASSWORD: ${{ secrets.ADMIN_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_BASIC_PASSWORD}" ]; then
            echo "::error::ADMIN_BASIC_PASSWORD GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          KEY=$(printf '%s' "$ADMIN_BASIC_PASSWORD" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put ADMIN_BASIC_PASSWORD --name gofixweb-report-trigger

      - name: Put UNSUBSCRIBE_SECRET on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${UNSUBSCRIBE_SECRET}" ]; then
            echo "::error::UNSUBSCRIBE_SECRET GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          KEY=$(printf '%s' "$UNSUBSCRIBE_SECRET" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put UNSUBSCRIBE_SECRET --name gofixweb-report-trigger

      - name: Put STRIPE_WEBHOOK_SECRET (live) on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_WEBHOOK_SECRET}" ]; then
            echo "::warning::STRIPE_WEBHOOK_SECRET GitHub secret is empty; leaving existing Worker live webhook secret unchanged."
            exit 0
          fi
          KEY=$(printf '%s' "$STRIPE_WEBHOOK_SECRET" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --name gofixweb-report-trigger

      - name: Put STRIPE_WEBHOOK_SECRET_TEST on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_WEBHOOK_SECRET_TEST}" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET_TEST GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          KEY=$(printf '%s' "$STRIPE_WEBHOOK_SECRET_TEST" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_WEBHOOK_SECRET_TEST --name gofixweb-report-trigger

      - name: Confirm Stripe webhook secrets on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler secret list --name gofixweb-report-trigger > /tmp/cf-secrets.json
          python -c "import json,sys; data=json.load(open('/tmp/cf-secrets.json',encoding='utf-8')); data=data if isinstance(data,list) else data.get('secrets') or data.get('result') or []; names={item.get('name') for item in data}; missing=[name for name in ('STRIPE_WEBHOOK_SECRET','STRIPE_WEBHOOK_SECRET_TEST') if name not in names]; raise SystemExit('missing Worker secrets: '+str(missing) if missing else 0)"

      - name: Ensure live Stripe subscription prices and webhook events
        if: steps.cf.outputs.present == 'true'
        id: stripe_live
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/ensure_stripe_live_subscriptions.py | tee /tmp/stripe-live.out
          grep -q '^webhook_ok=true$' /tmp/stripe-live.out
          echo "basic_price_id=$(sed -n 's/^basic_price_id=//p' /tmp/stripe-live.out)" >> "$GITHUB_OUTPUT"
          echo "pro_price_id=$(sed -n 's/^pro_price_id=//p' /tmp/stripe-live.out)" >> "$GITHUB_OUTPUT"
          echo "premium_price_id=$(sed -n 's/^premium_price_id=//p' /tmp/stripe-live.out)" >> "$GITHUB_OUTPUT"

      - name: Put live Stripe Price IDs on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_BASIC_PRICE_ID: ${{ steps.stripe_live.outputs.basic_price_id }}
          STRIPE_PRO_PRICE_ID: ${{ steps.stripe_live.outputs.pro_price_id }}
          STRIPE_PREMIUM_PRICE_ID: ${{ steps.stripe_live.outputs.premium_price_id }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_BASIC_PRICE_ID}" ] || [ -z "${STRIPE_PRO_PRICE_ID}" ] || [ -z "${STRIPE_PREMIUM_PRICE_ID}" ]; then
            echo "::error::Live Stripe Price IDs are empty after ensure_stripe_live_subscriptions."
            exit 1
          fi
          printf '%s' "$STRIPE_BASIC_PRICE_ID" | npx wrangler secret put STRIPE_BASIC_PRICE_ID --name gofixweb-report-trigger
          printf '%s' "$STRIPE_PRO_PRICE_ID" | npx wrangler secret put STRIPE_PRO_PRICE_ID --name gofixweb-report-trigger
          printf '%s' "$STRIPE_PREMIUM_PRICE_ID" | npx wrangler secret put STRIPE_PREMIUM_PRICE_ID --name gofixweb-report-trigger
