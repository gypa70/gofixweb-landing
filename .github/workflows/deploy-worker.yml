name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare token
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set — Worker must be deployed with wrangler from a logged-in machine."
          fi
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          echo "STRIPE_SECRET_KEY GitHub secret is present."

      - uses: cloudflare/wrangler-action@v3
        if: steps.cf.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

      - name: Put trimmed STRIPE_SECRET_KEY on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$STRIPE_SECRET_KEY" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_SECRET_KEY --name gofixweb-report-trigger

      - name: Confirm STRIPE_SECRET_KEY on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler secret list --name gofixweb-report-trigger > /tmp/cf-secrets.json
          cat /tmp/cf-secrets.json
          grep -q 'STRIPE_SECRET_KEY' /tmp/cf-secrets.json

      - name: Probe Stripe Checkout Session
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$STRIPE_SECRET_KEY" | tr -d '\r\n')
          echo "key_prefix=${KEY:0:7}"
          echo "key_len=${#KEY}"
          curl -sS -o /tmp/stripe.json -w "stripe_http=%{http_code}\n" \
            https://api.stripe.com/v1/checkout/sessions \
            -u "${KEY}:" \
            -d mode=payment \
            -d success_url='https://gofixweb.com/' \
            -d cancel_url='https://gofixweb.com/' \
            -d client_reference_id=manual_fix \
            -d 'line_items[0][quantity]=1' \
            -d 'line_items[0][price_data][currency]=czk' \
            -d 'line_items[0][price_data][unit_amount]=399000' \
            -d 'line_items[0][price_data][product_data][name]=GoFixWeb probe' \
            -d locale=cs
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/stripe.json", encoding="utf-8"))
          err = data.get("error")
          if err:
              print("stripe_error_type=", err.get("type"))
              print("stripe_error_code=", err.get("code"))
              print("stripe_error_message=", err.get("message"))
          else:
              print("session_id_prefix=", str(data.get("id") or "")[:12])
              print("amount_total=", data.get("amount_total"))
              print("currency=", data.get("currency"))
              print("has_url=", bool(data.get("url")))
          PY
