name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "blog/posts/**"
      - "scripts/build_blog.py"
      - "scripts/ensure_admin_html_kv.py"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      worker_ready: ${{ steps.cf.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - name: Build blog from markdown
        run: python scripts/build_blog.py

      - name: Check Cloudflare token
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set — Worker must be deployed with wrangler from a logged-in machine."
          fi
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          echo "STRIPE_SECRET_KEY GitHub secret is present."

      - name: Ensure ADMIN_HTML KV namespace
        if: steps.cf.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/ensure_admin_html_kv.py

      - uses: cloudflare/wrangler-action@v3
        if: steps.cf.outputs.present == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

      - name: Wait for Worker script to reach all colos
        if: steps.cf.outputs.present == 'true'
        run: sleep 8

      - name: Dump Worker GitHub probe for report-view token
        if: steps.cf.outputs.present == 'true'
        env:
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          VIEW_TOKEN: WxwUPYLwcnt11-UtoFRhVoAaXtidTsrwebajGnEagVE
        run: |
          set -euo pipefail
          HMAC=$(python3 - <<'PY'
          import hmac, hashlib, os
          print(hmac.new(os.environ["UNSUBSCRIBE_SECRET"].encode("utf-8"), f"report-view\n{os.environ['VIEW_TOKEN']}".encode("utf-8"), hashlib.sha256).hexdigest())
          PY
          )
          echo "===== DEBUG REPORT VIEW HEADERS ====="
          curl -sS -D - -o /tmp/dbg.json \
            "https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev/debug-report-view/${VIEW_TOKEN}?t=${HMAC}"
          echo "===== DEBUG REPORT VIEW BODY ====="
          cat /tmp/dbg.json
          echo
          echo "===== /view TRACE HEADERS ====="
          curl -sS -D - -o /tmp/view.html \
            "https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev/view/${VIEW_TOKEN}"

      - name: Purge report-view CDN cache and Worker Cache API
        if: steps.cf.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          VIEW_URL: https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev/view/WxwUPYLwcnt11-UtoFRhVoAaXtidTsrwebajGnEagVE
          VIEW_TOKEN: WxwUPYLwcnt11-UtoFRhVoAaXtidTsrwebajGnEagVE
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hmac, hashlib, json, os, urllib.request
          token = os.environ.get("CLOUDFLARE_API_TOKEN") or ""
          view = os.environ["VIEW_URL"]
          results = {"purges": []}
          if token:
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/zones?per_page=50",
                  headers={"Authorization": f"Bearer {token}", "User-Agent": "gofixweb-gha-purge"},
              )
              zones = json.load(urllib.request.urlopen(req, timeout=30))
              for zone in zones.get("result") or []:
                  body = json.dumps({"files": [view]}).encode()
                  preq = urllib.request.Request(
                      f"https://api.cloudflare.com/client/v4/zones/{zone['id']}/purge_cache",
                      data=body,
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Content-Type": "application/json",
                          "User-Agent": "gofixweb-gha-purge",
                      },
                  )
                  try:
                      with urllib.request.urlopen(preq, timeout=30) as resp:
                          results["purges"].append({"zone": zone.get("name"), "http": resp.status, "body": json.load(resp)})
                  except Exception as exc:
                      results["purges"].append({"zone": zone.get("name"), "error": str(exc)})
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
          HMAC=$(python3 - <<'PY'
          import hmac, hashlib, os
          print(hmac.new(os.environ["UNSUBSCRIBE_SECRET"].encode("utf-8"), f"report-view\n{os.environ['VIEW_TOKEN']}".encode("utf-8"), hashlib.sha256).hexdigest())
          PY
          )
          echo "===== WORKER CACHE PURGE ====="
          curl -sS -D - -o /tmp/worker-purge.json -X POST \
            "https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev/report-view/${VIEW_TOKEN}/purge?t=${HMAC}" \
            -A "gofixweb-gha-purge"
          echo
          cat /tmp/worker-purge.json
          echo

      - name: Verify /view serves GitHub snapshot from a clean runner
        if: steps.cf.outputs.present == 'true'
        run: |
          set -euo pipefail
          URL="https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev/view/WxwUPYLwcnt11-UtoFRhVoAaXtidTsrwebajGnEagVE"
          echo "===== RAW CURL STDOUT (headers via -D -) ====="
          curl -sS -D - -o /tmp/rv.html "$URL" | tee /tmp/rv.hdr
          echo "===== END HEADERS ====="
          python3 - <<'PY'
          from pathlib import Path
          hdr = Path("/tmp/rv.hdr").read_text(encoding="utf-8", errors="replace")
          html = Path("/tmp/rv.html").read_text(encoding="utf-8", errors="replace")
          print("===== /view FULL BODY =====")
          print(html, end="")
          print()
          print("===== END /view FULL BODY =====")
          src = next((line.split(":", 1)[1].strip() for line in hdr.splitlines() if line.lower().startswith("x-report-view-source:")), "")
          cache_key = next((line.split(":", 1)[1].strip() for line in hdr.splitlines() if line.lower().startswith("x-report-view-cache-key:")), "")
          print("x-report-view-source", src)
          print("x-report-view-cache-key", cache_key)
          assert src == "github", hdr
          assert cache_key == "v2", hdr
          assert "<!--gfw-view" in html, html[:400]
          assert "SKÓRE PŘED OPRAVOU" in html, html[:800]
          assert "58" in html and "71" in html
          compact = html.replace("\xa0", "").replace(" ", "")
          assert "2600" in compact and "31200" in compact, compact[:800]
          PY

      - name: Verify live Stripe secret before Worker put
        id: stripe_key
        if: steps.cf.outputs.present == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$STRIPE_SECRET_KEY" | tr -d '\r\n')
          if [ -z "$KEY" ]; then
            echo "::error::STRIPE_SECRET_KEY GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          code=$(curl -sS -o /tmp/stripe-bal.json -w '%{http_code}' \
            -u "${KEY}:" https://api.stripe.com/v1/balance)
          echo "stripe_http=$code"
          if [ "$code" != "200" ]; then
            echo "::error::STRIPE_SECRET_KEY is invalid (HTTP $code). Refusing to overwrite Worker secret."
            python -c "import json; d=json.load(open('/tmp/stripe-bal.json',encoding='utf-8')); err=d.get('error') or {}; print('stripe_error', err.get('type'), err.get('code'))"
            exit 1
          fi
          echo "Live Stripe secret is valid."

      - name: Put trimmed STRIPE_SECRET_KEY on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$STRIPE_SECRET_KEY" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_SECRET_KEY --name gofixweb-report-trigger

      - name: Confirm STRIPE_SECRET_KEY on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler secret list --name gofixweb-report-trigger > /tmp/cf-secrets.json
          cat /tmp/cf-secrets.json
          grep -q 'STRIPE_SECRET_KEY' /tmp/cf-secrets.json

      - name: Put ADMIN_BASIC_PASSWORD on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_BASIC_PASSWORD: ${{ secrets.ADMIN_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_BASIC_PASSWORD}" ]; then
            echo "::error::ADMIN_BASIC_PASSWORD GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          KEY=$(printf '%s' "$ADMIN_BASIC_PASSWORD" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put ADMIN_BASIC_PASSWORD --name gofixweb-report-trigger

      - name: Put UNSUBSCRIBE_SECRET on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${UNSUBSCRIBE_SECRET}" ]; then
            echo "::error::UNSUBSCRIBE_SECRET GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          KEY=$(printf '%s' "$UNSUBSCRIBE_SECRET" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put UNSUBSCRIBE_SECRET --name gofixweb-report-trigger

      - name: Put STRIPE_WEBHOOK_SECRET (live) on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_WEBHOOK_SECRET}" ]; then
            echo "::warning::STRIPE_WEBHOOK_SECRET GitHub secret is empty; leaving existing Worker live webhook secret unchanged."
            exit 0
          fi
          KEY=$(printf '%s' "$STRIPE_WEBHOOK_SECRET" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --name gofixweb-report-trigger

      - name: Put BANK_ACCOUNT on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BANK_ACCOUNT: ${{ secrets.BANK_ACCOUNT }}
          BANK_IBAN: ${{ secrets.BANK_IBAN }}
          BANK_BENEFICIARY: ${{ secrets.BANK_BENEFICIARY }}
        run: |
          set -euo pipefail
          if [ -z "${BANK_ACCOUNT}" ]; then
            echo "::warning::BANK_ACCOUNT GitHub secret is empty; leaving existing Worker bank details unchanged."
            exit 0
          fi
          KEY=$(printf '%s' "$BANK_ACCOUNT" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put BANK_ACCOUNT --name gofixweb-report-trigger
          if [ -n "${BANK_IBAN}" ]; then
            printf '%s' "$(printf '%s' "$BANK_IBAN" | tr -d '\r\n')" | npx wrangler secret put BANK_IBAN --name gofixweb-report-trigger
          fi
          if [ -n "${BANK_BENEFICIARY}" ]; then
            printf '%s' "$(printf '%s' "$BANK_BENEFICIARY" | tr -d '\r\n')" | npx wrangler secret put BANK_BENEFICIARY --name gofixweb-report-trigger
          fi

      - name: Put STRIPE_WEBHOOK_SECRET_TEST on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_WEBHOOK_SECRET_TEST}" ]; then
            echo "::error::STRIPE_WEBHOOK_SECRET_TEST GitHub secret is empty on gofixweb-landing."
            exit 1
          fi
          KEY=$(printf '%s' "$STRIPE_WEBHOOK_SECRET_TEST" | tr -d '\r\n')
          printf '%s' "$KEY" | npx wrangler secret put STRIPE_WEBHOOK_SECRET_TEST --name gofixweb-report-trigger

      - name: Confirm Stripe webhook secrets on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler secret list --name gofixweb-report-trigger > /tmp/cf-secrets.json
          python -c "import json,sys; data=json.load(open('/tmp/cf-secrets.json',encoding='utf-8')); data=data if isinstance(data,list) else data.get('secrets') or data.get('result') or []; names={item.get('name') for item in data}; missing=[name for name in ('STRIPE_WEBHOOK_SECRET','STRIPE_WEBHOOK_SECRET_TEST') if name not in names]; raise SystemExit('missing Worker secrets: '+str(missing) if missing else 0)"

      - name: Ensure live Stripe subscription prices and webhook events
        if: steps.cf.outputs.present == 'true'
        id: stripe_live
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          python scripts/ensure_stripe_live_subscriptions.py | tee /tmp/stripe-live.out
          grep -q '^webhook_ok=true$' /tmp/stripe-live.out
          echo "basic_price_id=$(sed -n 's/^basic_price_id=//p' /tmp/stripe-live.out)" >> "$GITHUB_OUTPUT"
          echo "pro_price_id=$(sed -n 's/^pro_price_id=//p' /tmp/stripe-live.out)" >> "$GITHUB_OUTPUT"
          echo "premium_price_id=$(sed -n 's/^premium_price_id=//p' /tmp/stripe-live.out)" >> "$GITHUB_OUTPUT"

      - name: Put live Stripe Price IDs on Worker
        if: steps.cf.outputs.present == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_BASIC_PRICE_ID: ${{ steps.stripe_live.outputs.basic_price_id }}
          STRIPE_PRO_PRICE_ID: ${{ steps.stripe_live.outputs.pro_price_id }}
          STRIPE_PREMIUM_PRICE_ID: ${{ steps.stripe_live.outputs.premium_price_id }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_BASIC_PRICE_ID}" ] || [ -z "${STRIPE_PRO_PRICE_ID}" ] || [ -z "${STRIPE_PREMIUM_PRICE_ID}" ]; then
            echo "::error::Live Stripe Price IDs are empty after ensure_stripe_live_subscriptions."
            exit 1
          fi
          printf '%s' "$STRIPE_BASIC_PRICE_ID" | npx wrangler secret put STRIPE_BASIC_PRICE_ID --name gofixweb-report-trigger
          printf '%s' "$STRIPE_PRO_PRICE_ID" | npx wrangler secret put STRIPE_PRO_PRICE_ID --name gofixweb-report-trigger
          printf '%s' "$STRIPE_PREMIUM_PRICE_ID" | npx wrangler secret put STRIPE_PREMIUM_PRICE_ID --name gofixweb-report-trigger

      - name: Dump Workers logs around Error 1102
        if: steps.cf.outputs.present == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("CLOUDFLARE_API_TOKEN") or ""
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID") or "47c841c4775065340b62547db3608ea4"
          if not token:
              print("no CLOUDFLARE_API_TOKEN")
              raise SystemExit(0)
          if not os.environ.get("CLOUDFLARE_ACCOUNT_ID"):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/accounts?per_page=5",
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read().decode("utf-8", "replace"))
              print("accounts", json.dumps(payload.get("result") or payload, ensure_ascii=False)[:2000])
              rows = payload.get("result") or []
              if rows:
                  account = rows[0].get("id") or account
          query = {
              "query": """
                query WorkerOverLimit($accountTag: string!, $datetimeStart: Time!, $datetimeEnd: Time!) {
                  viewer {
                    accounts(filter: {accountTag: $accountTag}) {
                      workersInvocationsAdaptiveGroups(
                        filter: {
                          scriptName: "gofixweb-report-trigger"
                          datetime_geq: $datetimeStart
                          datetime_lt: $datetimeEnd
                        }
                        limit: 50
                      ) {
                        avg { cpuTimeMs, wallTimeMs }
                        dimensions { status, datetimeHour, clientRequestHTTPHost }
                        sum { requests, errors, subrequests }
                      }
                    }
                  }
                }
              """,
              "variables": {
                  "accountTag": account,
                  "datetimeStart": "2026-09-14T11:45:00Z",
                  "datetimeEnd": "2026-09-14T11:55:00Z",
              },
          }
          body = json.dumps(query).encode("utf-8")
          req = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/graphql",
              data=body,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read().decode("utf-8", "replace")
          except Exception as err:
              print("graphql_failed", err)
              raise SystemExit(0)
          print(raw[:12000])
          PY

      - name: Probe /admin cache-status then warm then legal=1
        if: steps.cf.outputs.present == 'true'
        env:
          ADMIN_BASIC_PASSWORD: ${{ secrets.ADMIN_BASIC_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev"
          URL="$BASE/admin?legal=1"
          AUTH="gofixweb:${ADMIN_BASIC_PASSWORD}"
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID:-47c841c4775065340b62547db3608ea4}"
          echo "===== GET /admin/cache-status (no warm) ====="
          curl -sS -D - -o /tmp/cache-status.json --max-time 30 -u "$AUTH" "$BASE/admin/cache-status" || true
          echo
          cat /tmp/cache-status.json || true
          echo
          echo "===== Cloudflare cron schedules ====="
          curl -sS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/workers/scripts/gofixweb-report-trigger/schedules" \
            | head -c 4000 || true
          echo
          echo "===== POST /admin/warm-html ====="
          warm_code=$(curl -sS -o /tmp/admin-warm.json -w "%{http_code}" --max-time 30 \
            -u "$AUTH" -X POST "$BASE/admin/warm-html" || true)
          echo "warm-html HTTP $warm_code"
          cat /tmp/admin-warm.json || true
          echo
          if [ "$warm_code" != "200" ]; then
            echo "::error::POST /admin/warm-html returned $warm_code"
            exit 1
          fi
          echo "===== GET /admin?legal=1 within 5s of warm ====="
          code=$(curl -sS -D /tmp/admin-now.hdr -o /tmp/admin-now.html -w "%{http_code}" --max-time 30 -u "$AUTH" "$URL")
          bytes=$(wc -c < /tmp/admin-now.html | tr -d ' ')
          cache=$(awk -F': ' 'tolower($1)=="x-admin-cache"{print $2}' /tmp/admin-now.hdr | tr -d '\r')
          echo "immediate HTTP $code bytes=$bytes x-admin-cache=${cache:-none}"
          if [ "$code" != "200" ] || grep -q 'id="admin-cache-warming"' /tmp/admin-now.html; then
            echo "::error::immediate GET after warm is not the dashboard"
            head -c 400 /tmp/admin-now.html || true
            exit 1
          fi
          if ! grep -q 'id="tab-legal"' /tmp/admin-now.html; then
            echo "::error::immediate GET after warm missing tab-legal"
            exit 1
          fi
          if ! grep -q 'id="tab-legal-warmup"' /tmp/admin-now.html; then
            echo "::error::immediate GET after warm missing tab-legal-warmup"
            exit 1
          fi
          if ! grep -q 'id="tab-scan-stats"' /tmp/admin-now.html; then
            echo "::error::immediate GET after warm missing tab-scan-stats"
            exit 1
          fi
          if ! grep -q 'legalHealthHtml' /tmp/admin-now.html; then
            echo "::error::warmed /admin HTML missing legalHealthHtml (colo cache serving old dashboard?)"
            exit 1
          fi
          if ! grep -q 'legal-health-warn' /tmp/admin-now.html; then
            echo "::error::warmed /admin HTML missing legal-health-warn"
            exit 1
          fi
          echo "immediate dashboard ok"

  legal_e2e:
    needs: deploy
    if: needs.deploy.outputs.worker_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan www.ptacek.cz via POST /admin/legal-scan
        env:
          ADMIN_BASIC_PASSWORD: ${{ secrets.ADMIN_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev"
          AUTH="gofixweb:${ADMIN_BASIC_PASSWORD}"
          echo "===== POST /admin/legal-scan www.ptacek.cz send_email=1 ====="
          code=$(curl -sS -o /tmp/legal-post.html -w "%{http_code}" --max-time 30 \
            -u "$AUTH" -X POST -F "shop_url=www.ptacek.cz" -F "send_email=1" \
            --max-redirs 0 "$BASE/admin/legal-scan" || true)
          echo "post HTTP $code"
          if [ "$code" != "303" ]; then
            echo "::error::legal-scan POST expected 303, got $code"
            head -c 600 /tmp/legal-post.html || true
            exit 1
          fi
          json_code=""
          for i in 1 2 3 4 5 6; do
            json_code=$(curl -sS -o /tmp/legal-post.json -w "%{http_code}" --max-time 30 \
              -u "$AUTH" -A "gofixweb-gha-legal-e2e" \
              "$BASE/admin/legal-status" || true)
            echo "status-after-post try $i HTTP $json_code $(head -c 240 /tmp/legal-post.json || true)"
            if [ "$json_code" = "200" ] && grep -q '"send_email":true' /tmp/legal-post.json; then
              break
            fi
            sleep 2
          done
          if [ "$json_code" != "200" ] || ! grep -q '"send_email":true' /tmp/legal-post.json; then
            echo "::error::legal-status after send_email POST must have send_email true"
            cat /tmp/legal-post.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json, subprocess, time, os
          from datetime import datetime, timezone
          base = "https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev"
          password = os.environ["ADMIN_BASIC_PASSWORD"]
          started = time.time()
          last = {}
          saw_pending = False
          for i in range(24):
              raw = subprocess.check_output(
                  [
                      "curl", "-sS", "--max-time", "30",
                      "-u", f"gofixweb:{password}",
                      "-A", "gofixweb-gha-legal-e2e",
                      f"{base}/admin/legal-status",
                  ],
                  text=True,
              )
              last = json.loads(raw)
              print(f"poll {i+1} status={last.get('status')} shop={last.get('shop_url')} send_email={last.get('send_email')} mailed={last.get('email_sent_to')} err={last.get('email_error')}")
              if last.get("status") == "pending":
                  saw_pending = True
              if last.get("status") == "error" and saw_pending:
                  raise SystemExit(f"scan error: {last.get('error')}")
              if last.get("status") == "done" and (last.get("payload") or {}).get("url"):
                  at = str(last.get("at") or "")
                  try:
                      stamp = datetime.fromisoformat(at.replace("Z", "+00:00")).timestamp()
                  except ValueError:
                      stamp = 0
                  if stamp < started - 5:
                      print("stale done, waiting for this POST")
                      time.sleep(5)
                      continue
                  payload = last["payload"]
                  print("RESULT_SHOP", payload.get("url"))
                  print("RESULT_TERMS", (payload.get("terms") or {}).get("url"), (payload.get("terms") or {}).get("source"))
                  for key in (
                      "omnibus_30_days", "odr_link", "reviews_verification", "dsa_report_form",
                      "complaint_info", "withdrawal", "checkout_button", "epr_packaging",
                      "greenwashing_claims", "eaa_accessibility",
                  ):
                      block = payload.get(key) or {}
                      print(f"RULE {key} {block.get('result')}")
                  shop = str(payload.get("url") or last.get("shop_url") or "")
                  if "ptacek.cz" not in shop:
                      raise SystemExit(f"expected ptacek.cz, got {shop}")
                  mailed = str(last.get("email_sent_to") or "")
                  mail_err = str(last.get("email_error") or "")
                  print("RESULT_EMAIL", mailed or mail_err or "missing")
                  if "trueforexway@gmail.com" not in mailed:
                      raise SystemExit(f"email not sent: {mail_err or mailed or json.dumps(last)[:400]}")
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit(f"scan did not finish: {json.dumps(last)[:800]}")
          PY


  cold_admin:
    needs: deploy
    if: needs.deploy.outputs.worker_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait 6 minutes then cold-load /admin?legal=1 without warm
        env:
          ADMIN_BASIC_PASSWORD: ${{ secrets.ADMIN_BASIC_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="https://gofixweb-report-trigger.gofixweb-report-trigger.workers.dev"
          URL="$BASE/admin?legal=1"
          AUTH="gofixweb:${ADMIN_BASIC_PASSWORD}"
          echo "sleeping 360s (no warm-html) to match a later user load"
          sleep 360
          echo "===== GET /admin/cache-status after wait ====="
          curl -sS -o /tmp/status-wait.json --max-time 30 -u "$AUTH" "$BASE/admin/cache-status"
          cat /tmp/status-wait.json
          echo
          echo "===== POST /admin/purge-colo-html (simulate other colo) ====="
          curl -sS -o /tmp/purge.json -w "purge %{http_code}\n" --max-time 30 \
            -u "$AUTH" -X POST "$BASE/admin/purge-colo-html"
          cat /tmp/purge.json
          echo
          echo "===== GET /admin/cache-status after colo purge ====="
          curl -sS -o /tmp/status-purged.json --max-time 30 -u "$AUTH" "$BASE/admin/cache-status"
          cat /tmp/status-purged.json
          echo
          python3 - <<'PY'
          import json
          status = json.load(open("/tmp/status-purged.json", encoding="utf-8"))
          kv = status.get("kv") or {}
          if not kv.get("hit"):
              raise SystemExit("KV miss after wait+purge — Prague would still see the stub")
          PY
          for i in 1 2 3 4 5; do
            code=$(curl -sS -D /tmp/cold-$i.hdr -o /tmp/cold-$i.html -w "%{http_code}" --max-time 30 -u "$AUTH" "$URL")
            bytes=$(wc -c < /tmp/cold-$i.html | tr -d ' ')
            cache=$(awk -F': ' 'tolower($1)=="x-admin-cache"{print $2}' /tmp/cold-$i.hdr | tr -d '\r')
            echo "cold $i HTTP $code bytes=$bytes x-admin-cache=${cache:-none}"
            if [ "$code" != "200" ]; then
              echo "::error::cold admin?legal=1 try $i returned $code"
              head -c 800 /tmp/cold-$i.html || true
              exit 1
            fi
            if grep -qiE "Worker exceeded resource limits|Error 1102" /tmp/cold-$i.html; then
              echo "::error::cold try $i has Error 1102"
              exit 1
            fi
            if grep -q 'id="admin-cache-warming"' /tmp/cold-$i.html; then
              echo "::error::cold try $i is still the warming stub"
              head -c 400 /tmp/cold-$i.html || true
              exit 1
            fi
            if ! grep -q 'id="tab-legal"' /tmp/cold-$i.html || ! grep -q 'id="tab-legal-warmup"' /tmp/cold-$i.html || ! grep -q 'id="tab-scan-stats"' /tmp/cold-$i.html || ! grep -q 'id="legal-scan"' /tmp/cold-$i.html || ! grep -q 'admin-tabs' /tmp/cold-$i.html; then
              echo "::error::cold try $i is not the full dashboard"
              head -c 400 /tmp/cold-$i.html || true
              exit 1
            fi
          done
          echo "cold legal=1 loads ok after 6min wait and colo-cache purge"
