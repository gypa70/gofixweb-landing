name: Deploy GoFixWeb landing to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build landing
        working-directory: frontend
        run: npm run build

      - name: Assemble GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish
          cp -a frontend/dist/. publish/
          mkdir -p publish/data
          cp data/public_stats.json publish/data/public_stats.json
          cp -a wordpress-autofix publish/wordpress-autofix
          cp frontend/dist/index.html publish/404.html
          python -c "import json,sys; data=json.load(open('publish/data/public_stats.json',encoding='utf-8')); raise SystemExit(0 if isinstance(data.get('scanned_shops'), int) else 1)"

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - id: deployment
        uses: actions/deploy-pages@v4
