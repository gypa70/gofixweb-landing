name = "gofixweb-report-trigger"
main = "src/index.js"
compatibility_date = "2024-08-01"

# Production Worker for /submit, /checkout, /stripe-webhook, /wp-onboarding, /wp-rollback, /admin, and /unsubscribe.

[triggers]
# Stripe párování pro /admin — mimo page load (Error 1102).
crons = ["*/5 * * * *"]

[vars]
GITHUB_REPO = "gypa70/gofixweb-scanner"
ADMIN_BASIC_USER = "gofixweb"
