<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog GoFixWeb — články o rychlosti, SEO a opravách e-shopů.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Blog — GoFixWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a2332;
      --navy-light: #243044;
      --navy-card: #2a3548;
      --white: #ffffff;
      --text-light: #cbd5e1;
      --text-muted: #94a3b8;
      --green: #16a34a;
      --green-light: #22c55e;
      --border: rgba(255, 255, 255, 0.08);
      --max: 1080px;
      --header-h: 4.5rem;
    }
    html { scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--navy);
      color: var(--white);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(var(--max), 92vw); margin: 0 auto; }
    header {
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(26, 35, 50, 0.92);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    .header-inner {
      display: flex;
      align-items: center;
      gap: 0.75rem 1.25rem;
      min-width: 0;
    }
    .brand { flex-shrink: 0; }
    .logo {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .logo span { color: var(--green); }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 0.1rem;
      margin-left: auto;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      flex: 0 0 auto;
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
    }
    .site-nav a:hover {
      color: var(--white);
      background: rgba(255, 255, 255, 0.05);
    }
    .site-nav a.is-active {
      color: var(--green-light);
      border-bottom-color: var(--green);
    }
    main { flex: 1; padding: 4.5rem 0; }
    .blog-hero { max-width: 40rem; }
    h1 {
      font-size: clamp(1.65rem, 3.2vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.85rem;
    }
    .blog-hero p { color: var(--text-light); font-size: 1.05rem; }
    .blog-hero a { color: var(--green); font-weight: 600; }
    .blog-hero a:hover { text-decoration: underline; }
    footer {
      padding: 2.25rem 0;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    footer a { color: var(--green); font-weight: 500; }
    footer a:hover { text-decoration: underline; }
    .footer-links {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1rem;
    }
    @media (max-width: 768px) {
      :root { --header-h: 4.15rem; }
      .logo { font-size: 1.28rem; }
      .site-nav a { font-size: 0.95rem; padding: 0.42rem 0.55rem; }
      main { padding: 3rem 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="GoFixWeb — úvod">
        <div class="logo">GoFix<span>Web</span></div>
      </a>
      <nav class="site-nav" aria-label="Sekce stránky">
        <a href="/#signup-form">Report zdarma</a>
        <a href="/#reseni">Jak to funguje</a>
        <a href="/#tarify">Ceník</a>
        <a href="/blog/" class="is-active" aria-current="page">Blog</a>
        <a href="/#faq">FAQ</a>
        <a href="/#kontakt">Kontakt</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="blog-hero">
        <h1>Blog</h1>
        <p>Připravujeme články o rychlosti e-shopu, SEO a automatických opravách. Zatím můžete začít <a href="/#signup-form">bezplatným reportem</a>.</p>
      </div>
    </div>
  </main>
  <footer>
    <div class="container">
      <p>© 2026 FinalEdge s.r.o. / GoFixWeb</p>
      <div class="footer-links">
        <a href="/">gofixweb.com</a>
        <span aria-hidden="true">|</span>
        <a href="mailto:info@gofixweb.com">info@gofixweb.com</a>
        <span aria-hidden="true">|</span>
        <a href="/terms.html?v=20260902">Obchodní podmínky</a>
        <span aria-hidden="true">|</span>
        <a href="/privacy.html?v=20260815">Ochrana osobních údajů</a>
      </div>
    </div>
  </footer>
</body>
</html>
